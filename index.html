<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Map Challenge — a geography quiz game. Name countries, capitals, and states.">
<title>Map Challenge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button id="home-btn" class="icon-btn hidden" aria-label="Home">&#8962;</button>
  <h1 id="app-title">Map Challenge</h1>
  <button id="theme-btn" class="icon-btn" aria-label="Toggle dark mode">&#9790;</button>
</header>

<main>
  <!-- HOME -->
  <section id="view-home" class="view">
    <p class="tagline">How well do you know the world? Pick a game!</p>
    <div id="cards" class="cards"></div>
    <p class="footnote">Your stats and practice lists are saved on this device only.</p>
  </section>

  <!-- CONTINENT PICKER -->
  <section id="view-continent" class="view hidden">
    <h2 id="continent-title">Choose a continent</h2>
    <div id="continent-grid" class="cards"></div>
    <button id="continent-back" class="btn secondary">Back</button>
  </section>

  <!-- GAME -->
  <section id="view-game" class="view hidden">
    <div class="hud">
      <span id="hud-progress" class="hud-chip">0 / 0</span>
      <span id="hud-timer" class="hud-chip timer">30:00</span>
      <span id="hud-wrong" class="hud-chip wrong">❌ 0/3</span>
    </div>
    <div id="map-wrap"><svg id="map" role="img" aria-label="Quiz map"></svg></div>
    <div id="answer-panel" class="answer-panel hidden">
      <div id="answer-q" class="answer-q"></div>
      <div class="ac-wrap">
        <input id="answer-input" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="Type your answer…">
        <div id="ac-list" class="ac-list hidden"></div>
      </div>
      <div class="answer-btns">
        <button id="answer-submit" class="btn primary">Submit</button>
        <button id="answer-skip" class="btn secondary">Skip</button>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="view-results" class="view hidden">
    <div class="result-card">
      <h2 id="res-title">Results</h2>
      <div id="res-score" class="res-score">0%</div>
      <p id="res-detail" class="res-detail"></p>
      <p id="res-best" class="res-best"></p>
      <div class="btn-row">
        <button id="res-again" class="btn primary">Play again</button>
        <button id="res-learn" class="btn accent">Practice misses 📚</button>
      </div>
      <div class="btn-row">
        <button id="res-share" class="btn secondary">Share result 📋</button>
        <button id="res-home" class="btn secondary">Home</button>
      </div>
      <p id="res-copied" class="copied hidden">Copied to clipboard!</p>
    </div>
  </section>

  <!-- LEARN -->
  <section id="view-learn" class="view hidden">
    <div class="hud">
      <span id="learn-left" class="hud-chip">0 left</span>
      <span id="learn-streak" class="hud-chip">Streak 0/2</span>
      <button id="learn-clear" class="btn small secondary">Clear list</button>
    </div>
    <div id="learn-wrap"><svg id="learn-map" role="img" aria-label="Practice map"></svg></div>
    <div id="learn-empty" class="learn-empty hidden">
      <p>🎉 Nothing to practice!<br>Play a game first — the places you miss will show up here.</p>
      <button id="learn-empty-home" class="btn primary">Home</button>
    </div>
    <div id="learn-panel" class="answer-panel hidden">
      <div id="learn-q" class="answer-q"></div>
      <div class="ac-wrap">
        <input id="learn-input" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="Type your answer…">
        <div id="learn-ac" class="ac-list hidden"></div>
      </div>
      <div class="answer-btns">
        <button id="learn-submit" class="btn primary">Check</button>
        <button id="learn-skip" class="btn secondary">Skip</button>
      </div>
      <p id="learn-feedback" class="learn-feedback"></p>
    </div>
  </section>
</main>

<script src="js/data-world.js"></script>
<script src="js/data-us.js"></script>
<script src="js/app.js"></script>
</body>
</html>
